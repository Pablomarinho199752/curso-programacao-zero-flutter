name: curso_programacao_zero
description: Curso de Programacao do Zero - aplicativo educacional Flutter para Android e Windows.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  http: ^1.5.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/modules.json
    - assets/content/module_1_lessons.json
    - assets/content/module_2_12_lessons.json
    - assets/content/video_urls.json
