name: Build Android e Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Gerar arquivos de plataforma
        run: flutter create --platforms=android,windows --project-name curso_programacao_zero --org br.com.cursozero .
      - name: Preparar segurança e rede nativas
        run: python scripts/prepare_native_platforms.py
      - run: flutter pub get
      - name: Testar núcleo do laboratório Python
        run: python -m unittest discover -s python_runtime -p "test_*.py"
      - name: Configurar Python embarcado
        run: |
          echo "SERIOUS_PYTHON_VERSION=3.13" >> "$GITHUB_ENV"
          echo "SERIOUS_PYTHON_APP=$GITHUB_WORKSPACE/build/serious_python/app" >> "$GITHUB_ENV"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$GITHUB_WORKSPACE/build/serious_python/site-packages" >> "$GITHUB_ENV"
      - name: Empacotar runtime Python
        run: dart run serious_python:main package python_runtime -p Android --cleanup-app --cleanup-packages
      - run: flutter analyze
      - run: flutter test --timeout 60s --reporter expanded
      - run: flutter build apk --release
      - name: Preparar artefato
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/CursoProgramacao-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CursoProgramacao-Android
          path: dist/CursoProgramacao-Android.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    timeout-minutes: 55
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Gerar arquivos de plataforma
        run: flutter create --platforms=android,windows --project-name curso_programacao_zero --org br.com.cursozero .
      - name: Preparar segurança e rede nativas
        run: python scripts/prepare_native_platforms.py
      - run: flutter pub get
      - name: Configurar Python embarcado
        shell: powershell
        run: |
          "SERIOUS_PYTHON_VERSION=3.13" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SERIOUS_PYTHON_APP=$env:GITHUB_WORKSPACE\build\serious_python\app" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SERIOUS_PYTHON_SITE_PACKAGES=$env:GITHUB_WORKSPACE\build\serious_python\site-packages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Empacotar runtime Python
        run: dart run serious_python:main package python_runtime -p Windows --cleanup-app --cleanup-packages
      - run: flutter analyze
      - run: flutter test --timeout 60s --reporter expanded
      - run: flutter build windows --release
      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Gerar instalador
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\CursoProgramacao.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: CursoProgramacao-Windows
          path: dist/CursoProgramacao-Windows-Setup.exe
          if-no-files-found: error
